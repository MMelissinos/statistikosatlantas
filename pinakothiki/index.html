<style>
  :root {
    --bg: #0A0C10; --surface: #12161E;
    --border: rgba(229,181,103,0.16); --border-strong: rgba(229,181,103,0.42);
    --ink: #F2EFE9; --ink-2: #B6AFA4; --muted: #7C766D;
    --gold: #E5B567; --gold-soft: rgba(229,181,103,0.14); --danger: #F06C6C;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0; font-family: var(--font); color: var(--ink);
    background: radial-gradient(900px 500px at 80% -10%, rgba(229,181,103,0.08), transparent 60%), #0A0C10;
    background-attachment: fixed; line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .lock {
    position: fixed; inset: 0; z-index: 99999; width: 100%; height: 100dvh;
    background: radial-gradient(700px 420px at 50% 25%, rgba(229,181,103,0.09), transparent 65%), #0A0C10;
    display: grid; place-items: center; padding: 18px;
  }
  .lock[hidden] { display: none; }
  .lock-box {
    width: min(350px, 100%); background: #12161E; border: 1px solid var(--border-strong);
    border-radius: 20px; padding: 26px 20px; text-align: center;
    display: grid; gap: 14px; justify-items: center;
  }
  .lock-box img { width: 64px; height: 64px; border-radius: 16px; }
  .pin-inp {
    width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--border-strong);
    border-radius: 12px; padding: 11px 14px; text-align: center;
    letter-spacing: 0.25em; font-size: 1.1rem;
  }
  .lock-err { color: var(--danger); font-size: 0.82rem; min-height: 1.2em; }

  .wrap {
    width: 100%; max-width: 1400px; margin: 0 auto;
    padding: max(14px, env(safe-area-inset-top)) 14px max(48px, env(safe-area-inset-bottom));
    display: grid; gap: 14px;
  }
  .wrap[hidden] { display: none; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--border); min-width: 0; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand img { width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0; }
  .brand-title { font-family: var(--serif); font-size: clamp(1.1rem, 4.2vw, 1.35rem); line-height: 1.15; }
  .brand-sub { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; margin-top: 2px; }
  .controls { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; width: auto; max-width: 100%; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--ink-2);
    font-size: 0.82rem; cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  .btn:hover { border-color: var(--border-strong); color: var(--ink); }
  .btn.gold { border-color: rgba(229,181,103,0.55); background: var(--gold-soft); color: var(--gold); font-weight: 600; }
  .btn[hidden] { display: none; }
  .search { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 999px; padding: 7px 14px; font-size: 0.85rem; width: 200px; max-width: 100%; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .chip {
    border: 1px solid var(--border); background: rgba(255,255,255,0.025); color: var(--ink-2);
    padding: 6px 12px; border-radius: 999px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .chip[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-soft); color: var(--gold); font-weight: 600; }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
    width: 100%;
  }
  .tile {
    position: relative; border-radius: 12px; overflow: hidden;
    background: var(--surface); border: 1px solid rgba(255,255,255,0.06);
    cursor: pointer; display: flex; flex-direction: column; min-width: 0;
  }
  .tile img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #141820; }
  .tile-cap { padding: 8px 10px; background: #10131A; min-width: 0; }
  .tile-title { font-size: 0.78rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile-cat { font-size: 0.68rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fav-dot {
    position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18); background: rgba(10,12,16,0.68); color: var(--ink-2);
    display: grid; place-items: center; cursor: pointer; font-size: 0.85rem;
  }
  .fav-dot.on { color: var(--gold); border-color: var(--gold); }

  .lb {
    position: fixed; inset: 0; z-index: 9999; width: 100%; height: 100dvh;
    background: rgba(6,8,12,0.97); backdrop-filter: blur(10px);
    display: grid; grid-template-rows: auto 1fr auto;
    padding: max(12px, env(safe-area-inset-top)) 12px max(14px, env(safe-area-inset-bottom));
    overflow: hidden;
  }
  .lb[hidden] { display: none; }
  .lb-top, .lb-bot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .lb-stage { position: relative; display: grid; place-items: center; min-height: 0; width: 100%; padding: 8px 44px; overflow: hidden; touch-action: pan-y; }
  .lb-stage img { max-width: 100%; max-height: calc(100dvh - 175px); width: auto; height: auto; object-fit: contain; border-radius: 8px; }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--border-strong); background: rgba(15,18,24,0.82); color: var(--ink); font-size: 1.3rem; cursor: pointer; z-index: 2;
  }
  .lb-nav.prev { left: 4px; } .lb-nav.next { right: 4px; }
  .lb-title { font-family: var(--serif); font-size: 1rem; }
  .lb-meta { font-size: 0.76rem; color: var(--muted); }

  @media (max-width: 640px) {
    .wrap { padding-inline: 10px; gap: 12px; }
    .controls { width: 100%; }
    .search { flex: 1 1 100%; width: 100%; }
    .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .lb-stage { padding: 6px 4px; }
    .lb-nav { width: 34px; height: 34px; background: rgba(10,12,16,0.65); }
    .btn { padding: 6px 11px; font-size: 0.79rem; }
  }
</style>

</div>

<div class="lb" id="lightbox" hidden role="dialog" aria-modal="true">

: "orig/f3a8a779904e.jpg", "srcName": "seal_thrace.jpg"}, {"id": "4442fe326345", "title": "East", "cat": "art", "catLabel": "Εικαστικά & Χάρτες", "w": 2752, "h": 1536, "thumb": "thumbs/4442fe326345.webp", "orig": "orig/4442fe326345.webp", "srcName": "east.webp"}, {"id": "dd45c9874953", "title": "World", "cat": "art", "catLabel": "Εικαστικά & Χάρτες", "w": 2752, "h": 1536, "thumb": "thumbs/dd45c9874953.webp", "orig": "orig/dd45c9874953.webp", "srcName": "world.webp"}];
  const CATS = [["all", "Όλα (111)"], ["favs", "Αγαπημένα"], ["covers", "Εξώφυλλα Άλμπουμ (63)"], ["seals", "Σφραγίδες (21)"], ["art", "Εικαστικά & Χάρτες (27)"]];
  const $ = (id) => document.getElementById(id);

  async function sha256Hex(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('atlas_private_v1:' + str));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  let favs = new Set();
  try { favs = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); } catch {}
  const saveFavs = () => { try { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); } catch {} };

  let activeCat = 'all';
  let currentList = [...ALL_ITEMS];
  let lbIdx = -1;
  let slideTimer = null;
  let booted = false;

  function bootApp() {
    $('lockScreen').hidden = true;
    $('appWrap').hidden = false;
    if (!booted) { booted = true; applyFilter(); }
  }

  $('unlockForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const h = await sha256Hex($('pinInput').value.trim());
    if (h === MASTER_HASH) {
      try { localStorage.setItem(UNLOCK_KEY, h); } catch {}
      $('pinInput').value = '';
      $('pinErr').textContent = '';
      bootApp();
    } else {
      $('pinErr').textContent = 'Λάθος PIN.';
    }
  });

  $('lockNowBtn').addEventListener('click', () => {
    localStorage.removeItem(UNLOCK_KEY);
    $('appWrap').hidden = true;
    $('lockScreen').hidden = false;
    $('pinInput').focus();
  });

  function renderChips() {
    const wrap = $('chips');
    wrap.innerHTML = '';
    CATS.forEach(([id, label]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip';
      b.setAttribute('aria-pressed', String(activeCat === id));
      b.textContent = id === 'favs' ? `★ Αγαπημένα (${favs.size})` : label;
      b.addEventListener('click', () => { activeCat = id; applyFilter(); });
      wrap.appendChild(b);
    });
  }

  function applyFilter() {
    const q = $('searchInput').value.trim().toLowerCase();
    currentList = ALL_ITEMS.filter((it) => {
      if (activeCat === 'favs' && !favs.has(it.id)) return false;
      if (activeCat !== 'all' && activeCat !== 'favs' && it.cat !== activeCat) return false;
      if (q && !(it.title.toLowerCase().includes(q) || it.catLabel.toLowerCase().includes(q) || it.srcName.toLowerCase().includes(q))) return false;
      return true;
    });
    renderChips();
    renderGallery();
  }

  function renderGallery() {
    const g = $('gallery');
    g.innerHTML = '';
    $('subCount').textContent = `Αρχική ανάλυση · ${currentList.length} από ${ALL_ITEMS.length} έργα`;
    const frag = document.createDocumentFragment();
    currentList.forEach((it, idx) => {
      const card = document.createElement('article');
      card.className = 'tile';
      const isFav = favs.has(it.id);
      card.innerHTML = `
        <img src="${it.thumb}" alt="" loading="lazy" decoding="async">
        <button type="button" class="fav-dot ${isFav ? 'on' : ''}" aria-label="Αγαπημένο">★</button>
        <div class="tile-cap"><div class="tile-title"></div><div class="tile-cat">${it.catLabel} · ${it.w}×${it.h}</div></div>
      `;
      card.querySelector('.tile-title').textContent = it.title;
      card.querySelector('img').alt = it.title;
      card.querySelector('.fav-dot').addEventListener('click', (e) => { e.stopPropagation(); toggleFav(it.id); });
      card.addEventListener('click', () => openLightbox(idx));
      frag.appendChild(card);
    });
    g.appendChild(frag);
  }

  function toggleFav(id) {
    if (favs.has(id)) favs.delete(id); else favs.add(id);
    saveFavs(); renderChips();
    if (activeCat === 'favs') applyFilter(); else renderGallery();
    if (!$('lightbox').hidden && lbIdx >= 0 && currentList[lbIdx]) syncLbFav();
  }

  function syncLbFav() {
    const on = favs.has(currentList[lbIdx].id);
    $('lbFavBtn').classList.toggle('gold', on);
    $('lbFavBtn').textContent = on ? '★ Αγαπημένο' : '☆ Αγαπημένο';
  }

  function openLightbox(idx) {
    if (!currentList.length) return;
    lbIdx = (idx + currentList.length) % currentList.length;
    const it = currentList[lbIdx];
    $('lbImg').src = it.orig;
    $('lbTitle').textContent = it.title;
    $('lbMeta').textContent = `${it.catLabel} · ${it.w} × ${it.h} px (αρχική ανάλυση) · ${it.srcName}`;
    $('lbIndex').textContent = `${lbIdx + 1} / ${currentList.length}`;
    $('lbDlBtn').href = it.orig;
    $('lbDlBtn').download = it.srcName;
    syncLbFav();
    $('lightbox').hidden = false;
  }

  function stopSlideshow() {
    if (slideTimer) { clearInterval(slideTimer); slideTimer = null; }
    $('lbPlayBtn').textContent = 'Slideshow'; $('lbPlayBtn').classList.remove('gold');
  }
  function toggleSlideshow() {
    if (slideTimer) { stopSlideshow(); return; }
    if ($('lightbox').hidden) openLightbox(0);
    $('lbPlayBtn').textContent = 'Παύση'; $('lbPlayBtn').classList.add('gold');
    slideTimer = setInterval(() => openLightbox(lbIdx + 1), 4000);
  }
  function closeLightbox() { stopSlideshow(); $('lightbox').hidden = true; }

  $('lbPrev').addEventListener('click', () => openLightbox(lbIdx - 1));
  $('lbNext').addEventListener('click', () => openLightbox(lbIdx + 1));
  $('lbCloseBtn').addEventListener('click', closeLightbox);
  $('lbPlayBtn').addEventListener('click', toggleSlideshow);
  $('slideshowStartBtn').addEventListener('click', toggleSlideshow);
  $('lbFavBtn').addEventListener('click', () => { if (lbIdx >= 0 && currentList[lbIdx]) toggleFav(currentList[lbIdx].id); });
  $('shuffleBtn').addEventListener('click', () => {
    for (let i = currentList.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [currentList[i], currentList[j]] = [currentList[j], currentList[i]];
    }
    renderGallery();
  });
  $('searchInput').addEventListener('input', applyFilter);
  window.addEventListener('keydown', (e) => {
    if ($('lightbox').hidden) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowRight') openLightbox(lbIdx + 1);
    else if (e.key === 'ArrowLeft') openLightbox(lbIdx - 1);
    else if (e.code === 'Space') { e.preventDefault(); toggleSlideshow(); }
  });

  // Touch swipe in Lightbox for mobile
  let touchX = 0;
  $('lightbox').addEventListener('touchstart', (e) => {
    if (e.touches && e.touches.length === 1) touchX = e.touches[0].clientX;
  }, { passive: true });
  $('lightbox').addEventListener('touchend', (e) => {
    if (!e.changedTouches || !e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 45) openLightbox(dx < 0 ? lbIdx + 1 : lbIdx - 1);
  }, { passive: true });

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {}); });
  }
  let dp = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); dp = e; $('installBtn').hidden = false; });
  $('installBtn').addEventListener('click', async () => { if (!dp) return; dp.prompt(); try { await dp.userChoice; } catch {} dp = null; $('installBtn').hidden = true; });

  if (localStorage.getItem(UNLOCK_KEY) === MASTER_HASH) {
    bootApp();
  }
})();
</script>
