<title>Πινακοθήκη της Γλαύκας</title>
<style>
  :root {
    --bg: #0A0C10; --surface: #12161E;
    --border: rgba(229,181,103,0.16); --border-strong: rgba(229,181,103,0.42);
    --ink: #F2EFE9; --ink-2: #B6AFA4; --muted: #7C766D;
    --gold: #E5B567; --gold-soft: rgba(229,181,103,0.14); --danger: #F06C6C;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--font); color: var(--ink);
    background: radial-gradient(900px 500px at 80% -10%, rgba(229,181,103,0.08), transparent 60%), #0A0C10;
    background-attachment: fixed; line-height: 1.45;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* PIN Gate */
  .lock {
    position: fixed; inset: 0; z-index: 99999;
    background: radial-gradient(700px 420px at 50% 25%, rgba(229,181,103,0.09), transparent 65%), #0A0C10;
    display: grid; place-items: center; padding: 20px;
  }
  .lock[hidden] { display: none; }
  .lock-box {
    width: min(350px, 100%); background: #12161E; border: 1px solid var(--border-strong);
    border-radius: 20px; padding: 28px 24px; text-align: center;
    display: grid; gap: 14px; justify-items: center;
  }
  .lock-box img { width: 64px; height: 64px; border-radius: 16px; }
  .pin-inp {
    width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--border-strong);
    border-radius: 12px; padding: 11px 14px; text-align: center;
    letter-spacing: 0.25em; font-size: 1.1rem;
  }
  .lock-err { color: var(--danger); font-size: 0.82rem; min-height: 1.2em; }

  .wrap { max-width: 1400px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 18px max(50px, env(safe-area-inset-bottom)); display: grid; gap: 18px; }
  .wrap[hidden] { display: none; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 40px; height: 40px; border-radius: 10px; }
  .brand-title { font-family: var(--serif); font-size: 1.35rem; line-height: 1.1; }
  .brand-sub { font-size: 0.74rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px; }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px;
    border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--ink-2);
    font-size: 0.83rem; cursor: pointer; text-decoration: none;
  }
  .btn:hover { border-color: var(--border-strong); color: var(--ink); }
  .btn.gold { border-color: rgba(229,181,103,0.55); background: var(--gold-soft); color: var(--gold); font-weight: 600; }
  .btn[hidden] { display: none; }
  .search { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 999px; padding: 7px 14px; font-size: 0.85rem; width: 200px; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border); background: rgba(255,255,255,0.025); color: var(--ink-2);
    padding: 6px 12px; border-radius: 999px; font-size: 0.81rem; cursor: pointer;
  }
  .chip[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-soft); color: var(--gold); font-weight: 600; }

  .gallery { columns: 5 180px; column-gap: 14px; }
  @media (max-width: 600px) { .gallery { columns: 2; column-gap: 10px; } }
  .tile {
    break-inside: avoid; margin-bottom: 14px; position: relative; border-radius: 12px;
    overflow: hidden; background: var(--surface); border: 1px solid rgba(255,255,255,0.06); cursor: pointer;
  }
  .tile img { display: block; width: 100%; height: auto; background: #141820; }
  .tile-cap { padding: 8px 10px; background: #10131A; }
  .tile-title { font-size: 0.78rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile-cat { font-size: 0.68rem; color: var(--muted); }
  .fav-dot {
    position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18); background: rgba(10,12,16,0.68); color: var(--ink-2);
    display: grid; place-items: center; cursor: pointer; font-size: 0.85rem;
  }
  .fav-dot.on { color: var(--gold); border-color: var(--gold); }

  .lb {
    position: fixed; inset: 0; z-index: 9999; background: rgba(6,8,12,0.96);
    backdrop-filter: blur(10px); display: grid; grid-template-rows: auto 1fr auto; padding: 14px 16px;
  }
  .lb[hidden] { display: none; }
  .lb-top, .lb-bot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .lb-stage { position: relative; display: grid; place-items: center; min-height: 0; padding: 8px 40px; }
  .lb-stage img { max-width: 100%; max-height: calc(100vh - 150px); object-fit: contain; border-radius: 10px; }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--border-strong); background: rgba(15,18,24,0.8); color: var(--ink); font-size: 1.3rem; cursor: pointer;
  }
  .lb-nav.prev { left: 2px; } .lb-nav.next { right: 2px; }
  .lb-title { font-family: var(--serif); font-size: 1.05rem; }
  .lb-meta { font-size: 0.78rem; color: var(--muted); }
</style>
</head>
<body>

<div class="lock" id="lockScreen">
  <form class="lock-box" id="unlockForm">
    <img src="icon-192.png" alt="Πινακοθήκη" width="64" height="64">
    <div>
      <div class="brand-title">Πινακοθήκη της Γλαύκας</div>
      <div class="brand-sub" style="margin-top:4px">Ιδιωτική πρόσβαση</div>
    </div>
    <input class="pin-inp" id="pinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="Εισαγωγή PIN">
    <button type="submit" class="btn gold" style="width:100%;justify-content:center;padding:10px">Ξεκλείδωμα</button>
    <div class="lock-err" id="pinErr"></div>
  </form>
</div>

<div class="wrap" id="appWrap" hidden>
  <header class="topbar">
    <div class="brand">
      <img src="icon-192.png" alt="Πινακοθήκη" width="40" height="40">
      <div>
        <div class="brand-title">Πινακοθήκη της Γλαύκας</div>
        <div class="brand-sub" id="subCount">Ιδιωτική συλλογή · 470 έργα</div>
      </div>
    </div>
    <div class="controls">
      <input class="search" id="searchInput" type="search" placeholder="Αναζήτηση…">
      <button type="button" class="btn" id="shuffleBtn">Τυχαία</button>
      <button type="button" class="btn gold" id="slideshowStartBtn">Slideshow</button>
      <button type="button" class="btn" id="lockNowBtn">Κλείδωμα</button>
      <button type="button" class="btn gold" id="installBtn" hidden>Εγκατάσταση app</button>
    </div>
  </header>
  <nav class="chips" id="chips"></nav>
  <main class="gallery" id="gallery"></main>
</div>

<div class="lb" id="lightbox" hidden role="dialog" aria-modal="true">
  <div class="lb-top">
    <div>
      <div class="lb-title" id="lbTitle"></div>
      <div class="lb-meta" id="lbMeta"></div>
    </div>
    <div class="controls">
      <button type="button" class="btn" id="lbFavBtn">★</button>
      <button type="button" class="btn" id="lbPlayBtn">Slideshow</button>
      <a class="btn" id="lbDlBtn" download>Λήψη</a>
      <button type="button" class="btn gold" id="lbCloseBtn">Κλείσιμο</button>
    </div>
  </div>
  <div class="lb-stage">
    <button type="button" class="lb-nav prev" id="lbPrev" aria-label="Προηγούμενο">‹</button>
    <img id="lbImg" alt="">
    <button type="button" class="lb-nav next" id="lbNext" aria-label="Επόμενο">›</button>
  </div>
  <div class="lb-bot">
    <span class="lb-meta" id="lbIndex"></span>
  </div>
</div>

    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('atlas_private_v1:' + str));

      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip';
      b.setAttribute('aria-pressed', String(activeCat === id));
      b.textContent = id === 'favs' ? `★ Αγαπημένα (${favs.size})` : label;
      b.addEventListener('click', () => { activeCat = id; applyFilter(); });
      wrap.appendChild(b);
    });
  }

  function applyFilter() {
    const q = $('searchInput').value.trim().toLowerCase();
    currentList = ALL_ITEMS.filter((it) => {
      if (activeCat === 'favs' && !favs.has(it.id)) return false;
      if (activeCat !== 'all' && activeCat !== 'favs' && it.cat !== activeCat) return false;
      if (q && !(it.title.toLowerCase().includes(q) || it.catLabel.toLowerCase().includes(q) || it.srcName.toLowerCase().includes(q))) return false;
      return true;
    });
    renderChips();
    renderGallery();
  }

  function renderGallery() {
    const g = $('gallery');
    g.innerHTML = '';
    $('subCount').textContent = `Ιδιωτική συλλογή · ${currentList.length} από ${ALL_ITEMS.length} έργα`;
    const frag = document.createDocumentFragment();
    currentList.forEach((it, idx) => {
      const card = document.createElement('article');
      card.className = 'tile';
      const isFav = favs.has(it.id);
      card.innerHTML = `
        <img src="${it.src}" alt="" loading="lazy" decoding="async">
        <button type="button" class="fav-dot ${isFav ? 'on' : ''}" aria-label="Αγαπημένο">★</button>
        <div class="tile-cap"><div class="tile-title"></div><div class="tile-cat">${it.catLabel}</div></div>
      `;
      card.querySelector('.tile-title').textContent = it.title;
      card.querySelector('img').alt = it.title;
      card.querySelector('.fav-dot').addEventListener('click', (e) => { e.stopPropagation(); toggleFav(it.id); });
      card.addEventListener('click', () => openLightbox(idx));
      frag.appendChild(card);
    });
    g.appendChild(frag);
  }

  function toggleFav(id) {
    if (favs.has(id)) favs.delete(id); else favs.add(id);
    saveFavs(); renderChips();
    if (activeCat === 'favs') applyFilter(); else renderGallery();
    if (!$('lightbox').hidden && lbIdx >= 0 && currentList[lbIdx]) syncLbFav();
  }

  function syncLbFav() {
    const on = favs.has(currentList[lbIdx].id);
    $('lbFavBtn').classList.toggle('gold', on);
    $('lbFavBtn').textContent = on ? '★ Αγαπημένο' : '☆ Αγαπημένο';
  }

  function openLightbox(idx) {
    if (!currentList.length) return;
    lbIdx = (idx + currentList.length) % currentList.length;
    const it = currentList[lbIdx];
    $('lbImg').src = it.src;
    $('lbTitle').textContent = it.title;
    $('lbMeta').textContent = `${it.catLabel} · ${it.w} × ${it.h} px`;
    $('lbIndex').textContent = `${lbIdx + 1} / ${currentList.length}`;
    $('lbDlBtn').href = it.src;
    $('lbDlBtn').download = `${it.id}.webp`;
    syncLbFav();
    $('lightbox').hidden = false;
  }

  function stopSlideshow() {
    if (slideTimer) { clearInterval(slideTimer); slideTimer = null; }
    $('lbPlayBtn').textContent = 'Slideshow'; $('lbPlayBtn').classList.remove('gold');
  }
  function toggleSlideshow() {
    if (slideTimer) { stopSlideshow(); return; }
    if ($('lightbox').hidden) openLightbox(0);
    $('lbPlayBtn').textContent = 'Παύση'; $('lbPlayBtn').classList.add('gold');
    slideTimer = setInterval(() => openLightbox(lbIdx + 1), 4000);
  }
  function closeLightbox() { stopSlideshow(); $('lightbox').hidden = true; }

  $('lbPrev').addEventListener('click', () => openLightbox(lbIdx - 1));
  $('lbNext').addEventListener('click', () => openLightbox(lbIdx + 1));
  $('lbCloseBtn').addEventListener('click', closeLightbox);
  $('lbPlayBtn').addEventListener('click', toggleSlideshow);
  $('slideshowStartBtn').addEventListener('click', toggleSlideshow);
  $('lbFavBtn').addEventListener('click', () => { if (lbIdx >= 0 && currentList[lbIdx]) toggleFav(currentList[lbIdx].id); });
  $('shuffleBtn').addEventListener('click', () => {
    for (let i = currentList.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [currentList[i], currentList[j]] = [currentList[j], currentList[i]];
    }
    renderGallery();
  });
  $('searchInput').addEventListener('input', applyFilter);
  window.addEventListener('keydown', (e) => {
    if ($('lightbox').hidden) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowRight') openLightbox(lbIdx + 1);
    else if (e.key === 'ArrowLeft') openLightbox(lbIdx - 1);
    else if (e.code === 'Space') { e.preventDefault(); toggleSlideshow(); }
  });

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {}); });
  }
  let dp = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); dp = e; $('installBtn').hidden = false; });
  $('installBtn').addEventListener('click', async () => { if (!dp) return; dp.prompt(); try { await dp.userChoice; } catch {} dp = null; $('installBtn').hidden = true; });

  if (localStorage.getItem(UNLOCK_KEY) === MASTER_HASH) {
    bootApp();
  }
})();
</script>
</body>
</html>
