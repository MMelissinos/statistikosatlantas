name: Internal link opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: "43 7 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Analyze internal links
        run: node scripts/internal-link-opportunities.mjs

      - name: Save full report
        uses: actions/upload-artifact@v4
        with:
          name: internal-link-opportunities
          path: internal-link-opportunities.md
          retention-days: 30

      - name: Open or update recommendations issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Εβδομαδιαίες προτάσεις εσωτερικών συνδέσμων';
            const report = fs.readFileSync('internal-link-opportunities.md', 'utf8');
            const body = (report + '\n\n[Πλήρης εκτέλεση](' +
              context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo +
              '/actions/runs/' + context.runId + ')').slice(0, 60000);
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open'
            });
            const existing = open.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                ...context.repo, issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
